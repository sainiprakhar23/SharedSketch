# Custom values for kube-prometheus-stack on K3s (AWS Free Tier Tuned)
# Minimizes memory/CPU footprints by disabling absent K3s control-plane components.

# Disable components managed internally by K3s single-node binary
kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

# Prometheus Configuration
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    retention: 3d
    retentionSize: 1GB
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Alertmanager Configuration
alertmanager:
  alertmanagerSpec:
    retention: 24h
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 128Mi

# Grafana Configuration (Internal ClusterIP, No Public Ingress)
grafana:
  enabled: true
  adminPassword: "admin" # Change upon first login
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "sharedsketch"
          orgId: 1
          folder: "SharedSketch"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/sharedsketch
  dashboards:
    sharedsketch:
      sharedsketch-dashboard:
        file: dashboards/sharedsketch-dashboard.json
