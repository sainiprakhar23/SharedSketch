<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SharedSketch drawing room — draw in real time with your teammates on a shared whiteboard.">
    <title>SharedSketch - Drawing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="canvas-style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <h2 class="room-title">
                <svg class="nav-logo" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="2" width="20" height="20" rx="6" stroke="url(#navGrad)" stroke-width="1.8" fill="none"/>
                    <path d="M8 16 C8 10, 12 8, 16 8" stroke="url(#navGrad)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
                    <circle cx="16" cy="8" r="2" fill="#8b5cf6"/>
                    <circle cx="8" cy="16" r="1.5" fill="#06b6d4"/>
                    <defs>
                        <linearGradient id="navGrad" x1="2" y1="2" x2="22" y2="22">
                            <stop stop-color="#8b5cf6"/>
                            <stop offset="1" stop-color="#06b6d4"/>
                        </linearGradient>
                    </defs>
                </svg>
                Canvas
            </h2>
            <div class="room-info">
                <span class="badge">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                        <rect x="1.5" y="1.5" width="9" height="9" rx="2"/>
                    </svg>
                    Room: <strong id="roomIdDisplay">Loading...</strong>
                </span>
                <span class="badge badge-user">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                        <circle cx="6" cy="4" r="2.5"/><path d="M1.5 11a4.5 4.5 0 019 0"/>
                    </svg>
                    You: <strong id="userNameDisplay">Loading...</strong>
                </span>
            </div>
        </div>
        
        <div class="navbar-center">
            <span class="users-count">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <circle cx="5" cy="4" r="2.5"/><path d="M0.5 12a4.5 4.5 0 019 0"/><circle cx="10" cy="5" r="2"/><path d="M9.5 12a3.5 3.5 0 014 0" opacity="0.6"/>
                </svg>
                <strong id="usersCount">1</strong> user(s) online
            </span>
            <div class="users-list" id="usersList"></div>
        </div>

        <div class="navbar-right">
            <button class="btn-icon" onclick="toggleFullscreen()" title="Fullscreen">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/>
                </svg>
                <span class="btn-label">Fullscreen</span>
            </button>
            <button class="btn-icon danger" onclick="leaveRoom()" title="Leave Room">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 14H3a1 1 0 01-1-1V3a1 1 0 011-1h3M11 11l3-3-3-3M7 8h7"/>
                </svg>
                <span class="btn-label">Leave</span>
            </button>
        </div>
    </nav>

    <div class="main-container">
        <aside class="toolbar-sidebar">
            <div class="tool-group">
                <label>Tools</label>
                <button class="tool-btn active" id="brushTool" onclick="selectTool('brush')" title="Brush">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2.5l1 1-9 9-3 1 1-3 9-9z"/><path d="M11 5l2 2"/>
                    </svg>
                    <span>Brush</span>
                </button>
                <button class="tool-btn" id="eraserTool" onclick="selectTool('eraser')" title="Eraser">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 15h12M5 11l6-6 3 3-6 6H5v-3z"/>
                    </svg>
                    <span>Eraser</span>
                </button>
            </div>

            <div class="tool-group">
                <label>Shapes</label>
                <button class="tool-btn" id="lineTool" onclick="selectTool('line')" title="Line">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                        <line x1="3" y1="15" x2="15" y2="3"/>
                    </svg>
                    <span>Line</span>
                </button>
                <button class="tool-btn" id="rectangleTool" onclick="selectTool('rectangle')" title="Rectangle">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="12" height="10" rx="1.5"/>
                    </svg>
                    <span>Rectangle</span>
                </button>
                <button class="tool-btn" id="circleTool" onclick="selectTool('circle')" title="Circle">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6">
                        <circle cx="9" cy="9" r="6.5"/>
                    </svg>
                    <span>Circle</span>
                </button>
            </div>

            <div class="tool-group">
                <label>Color</label>
                <div class="color-picker-container">
                    <input type="color" id="colorPicker" value="#000000" onchange="changeColor(this.value)">
                    <span class="color-preview" id="colorPreview" style="background: #000000;"></span>
                </div>
            </div>

            <div class="tool-group">
                <label>Brush Size</label>
                <input type="range" id="strokeWidth" min="1" max="50" value="3" 
                       oninput="changeStrokeWidth(this.value)">
                <span class="stroke-display" id="strokeDisplay">3px</span>
            </div>

            <div class="tool-group">
                <label>Actions</label>
                <button class="tool-btn" onclick="undoAction()" title="Undo">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 7h7a4 4 0 010 8H8"/><path d="M7 4L4 7l3 3"/>
                    </svg>
                    <span>Undo</span>
                </button>
                <button class="tool-btn" onclick="redoAction()" title="Redo">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 7H7a4 4 0 000 8h3"/><path d="M11 4l3 3-3 3"/>
                    </svg>
                    <span>Redo</span>
                </button>
                <button class="tool-btn danger-btn" onclick="clearCanvas()" title="Clear Canvas">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 5h12M7 5V3h4v2M4 5l1 10h8l1-10"/><line x1="7" y1="8" x2="7" y2="13"/><line x1="11" y1="8" x2="11" y2="13"/>
                    </svg>
                    <span>Clear</span>
                </button>
            </div>

            <div class="tool-group">
                <button class="tool-btn download-btn" onclick="downloadCanvas()" title="Download Drawing">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 3v9M5 9l4 4 4-4"/><path d="M3 14h12"/>
                    </svg>
                    <span>Download</span>
                </button>
            </div>
        </aside>

        <div class="canvas-container">
            <canvas id="canvas"></canvas>
            
            <canvas id="remoteCanvas" class="remote-canvas"></canvas>
            
            <div class="cursors-container" id="cursorsContainer"></div>
        </div>
    </div>

    <div class="info-bar">
        <div class="info-item">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                <circle cx="7" cy="7" r="1.5"/><path d="M7 1v2M7 11v2M1 7h2M11 7h2M2.8 2.8l1.4 1.4M9.8 9.8l1.4 1.4M2.8 11.2l1.4-1.4M9.8 4.2l1.4-1.4"/>
            </svg>
            <span>Position: <strong id="posDisplay">0, 0</strong></span>
        </div>
        <div class="info-item">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.5 1.5l2 2-8 8-3 1 1-3 8-8z"/>
            </svg>
            <span>Tool: <strong id="toolDisplay">Brush</strong></span>
        </div>
        <div class="info-item">
            <span id="statusDisplay">Connected</span>
        </div>
    </div>

    <script src="websocket.js"></script>
    <script src="canvas.js"></script>
</body>
</html>
