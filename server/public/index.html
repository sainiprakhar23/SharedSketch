<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time collaborative drawing canvas — create or join a room and draw together with your team in real time.">
    <title>SharedSketch — Real-Time Collaborative Drawing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated background orbs -->
    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <!-- Grid overlay -->
    <div class="grid-overlay" aria-hidden="true"></div>

    <div class="container">
        <div class="header">
            <div class="logo-icon" aria-hidden="true">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <rect x="4" y="4" width="40" height="40" rx="12" stroke="url(#logoGrad)" stroke-width="2.5" fill="none"/>
                    <path d="M16 32 C16 20, 24 16, 32 16" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                    <path d="M14 28 C18 18, 28 14, 34 18" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
                    <circle cx="32" cy="16" r="3" fill="#8b5cf6"/>
                    <circle cx="16" cy="32" r="2.5" fill="#06b6d4"/>
                    <defs>
                        <linearGradient id="logoGrad" x1="4" y1="4" x2="44" y2="44">
                            <stop stop-color="#8b5cf6"/>
                            <stop offset="1" stop-color="#06b6d4"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1>SharedSketch</h1>
            <p>One canvas. Endless collaboration.</p>
        </div>

        <div class="card main-card">
            <div class="form-group">
                <label for="userName">Your Name</label>
                <input 
                    type="text" 
                    id="userName" 
                    placeholder="e.g., John Doe"
                    maxlength="30"
                >
            </div>

            <div class="toggle-buttons">
                <button class="toggle-btn active" onclick="switchMode('create')">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/>
                    </svg>
                    Create Room
                </button>
                <button class="toggle-btn" onclick="switchMode('join')">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 2l4 4-4 4"/><path d="M14 6H6"/><path d="M4 2H3a1 1 0 00-1 1v10a1 1 0 001 1h1"/>
                    </svg>
                    Join Room
                </button>
            </div>

            <div id="createSection" class="form-section active">
                <div class="form-group">
                    <label for="createRoomName">Room Name</label>
                    <input 
                        type="text" 
                        id="createRoomName" 
                        placeholder="e.g., Team Design"
                        maxlength="50"
                    >
                </div>

                <div class="form-group">
                    <label for="createCapacity">Room Capacity</label>
                    <input type="number" id="createCapacity" min="2" max="20" value="5" />
                </div>

                <button class="btn btn-primary" onclick="createRoom()">
                    <span>Create Room</span>
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9h12M11 5l4 4-4 4"/>
                    </svg>
                </button>
                <p class="room-id-display" id="createRoomId"></p>
            </div>

            <div id="joinSection" class="form-section">
                <div class="form-group">
                    <label for="joinRoomId">Room ID</label>
                    <input 
                        type="text" 
                        id="joinRoomId" 
                        placeholder="e.g., ABC123DEF456"
                        maxlength="20"
                    >
                </div>

                <button class="btn btn-secondary" onclick="joinRoom()">
                    <span>Join Room</span>
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9h12M11 5l4 4-4 4"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="features">
            <div class="feature-item">
                <div class="feature-icon">
                    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="9"/><path d="M11 7v4l3 2"/>
                    </svg>
                </div>
                <span>Real-Time Sync</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">
                    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 7h8v8H7z"/><path d="M3 11h4M15 11h4M11 3v4M11 15v4"/>
                    </svg>
                </div>
                <span>Multiple Tools</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">
                    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3a5 5 0 015 5c0 2-1 3-2 4"/><circle cx="11" cy="16" r="3"/>
                        <path d="M4 8a7 7 0 0114 0"/>
                    </svg>
                </div>
                <span>Team Cursors</span>
            </div>
        </div>

        <div class="footer">
            <p>Start collaborating now — draw, share, create together.</p>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
